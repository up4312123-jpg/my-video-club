<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五房制視訊大廳</title>
  <script src="https://socket.io"></script>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .room-card { border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; background: #fafafa; }
    .room-card.active { border-color: #4CAF50; background: #f1f8e9; }
    button { padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 5px; margin-bottom: 5px; }
    .btn-primary { background: #1976d2; color: white; }
    .btn-success { background: #388e3c; color: white; }
    .btn-danger { background: #d32f2f; color: white; }
    .btn-warning { background: #f57c00; color: white; }
    .btn-secondary { background: #607d8b; color: white; }
    input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 12px; width: 90%; display: block; font-size: 15px; }
    .hidden { display: none !important; }
    .member-tag { display: inline-block; background: #e3f2fd; padding: 4px 10px; border-radius: 15px; margin: 3px; font-size: 14px; }
    .badge-online { background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
    .badge-offline { background: #eeeeee; color: #757575; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge-paired { background: #fff3e0; color: #ef6c00; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin: 15px 0; background: #1e1e1e; padding: 15px; border-radius: 8px; }
    .video-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; border: 2px solid #555; }
    .video-wrapper video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.75); color: white; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }
    .status-bar { padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; font-weight: bold; text-align: center; }
    .status-wait { background: #fff3e0; color: #e65100; }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
<div class="container">
  <div id="loginBox" class="card" style="max-width: 420px; margin: 40px auto;">
    <h2>進入視訊大廳</h2>
    <div id="connStatus" class="status-bar status-wait">⏳ 正在連線至伺服器，請稍候...</div>
    
    <label style="font-weight:bold; display:block; margin-bottom:5px;">1. 你的稱呼（必填）：</label>
    <input type="text" id="nicknameInput" placeholder="隨便輸入一個稱呼 (例: 小明)">
    
    <label style="font-weight:bold; display:block; margin-bottom:5px;">2. 手機 ntfy 推播頻道（選填）：</label>
    <input type="text" id="ntfyInput" placeholder="填寫純英文數字可接收手機呼叫 (可留空)">

    <div style="margin-bottom: 15px; display: flex; align-items: center;">
      <input type="checkbox" id="rememberCheckbox" style="margin: 0 8px 0 0; cursor: pointer;" checked>
      <label for="rememberCheckbox" style="cursor: pointer; font-size: 14px;">記住我的稱呼與 ntfy 頻道</label>
    </div>

    <button id="enterBtn" class="btn-primary" style="width:100%; padding:12px; font-size:16px;" onclick="enterLobby()">立即進入大廳</button>
  </div>

  <div id="mainBox" class="hidden">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        <strong>歡迎，<span id="myNameDisplay"></span></strong> | 
        全站視訊總人數：<span id="totalUsersDisplay" style="color:#d32f2f; font-weight:bold;">0 / 20</span>
      </div>
      <div>
        <span id="myStatusDisplay" style="color:#1976d2; font-weight:bold; margin-right:15px;">目前位置：大廳</span>
        <button class="btn-secondary" onclick="changeMyNtfy()">⚙️ 設定 ntfy 推播頻道</button>
      </div>
    </div>

    <div id="currentRoomPanel" class="card hidden" style="border: 2px solid #1976d2;">
      <h3 id="currentRoomTitle">你正在：房間 X</h3>
      <p>房間內成員：<span id="roomMembersList"></span></p>
      <div id="videoGrid" class="video-grid"></div>
      <div style="margin-top: 10px;">
        <button id="toggleMicBtn" class="btn-secondary" onclick="toggleMic()">🎤 麥克風：開啟</button>
        <button id="toggleCamBtn" class="btn-secondary" onclick="toggleCam()">📷 鏡頭：開啟</button>
        <button class="btn-danger" onclick="initiateLeaveRoom()">🚪 離開房間</button>
      </div>
    </div>

    <div class="card">
      <h3>視訊房間列表（共 5 間）</h3>
      <div id="roomsContainer" class="rooms-grid"></div>
    </div>

    <div class="card">
      <h3>成員名單與手機推播呼叫（首次需雙方輸入相同四位數密碼綁定）</h3>
      <div id="contactList"></div>
    </div>
  </div>
</div>

<script>
  const socket = io();
  let myUser = null;
  let latestState = null;
  let localStream = null;
  let peerConnections = {};

  const rtcConfig = {
    iceServers: [
      { urls: 'stun:://google.com' },
      { urls: 'stun:://google.com' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };

  socket.on('connect', () => {
    const statusEl = document.getElementById('connStatus');
    if (statusEl) {
      statusEl.innerText = '✅ 已成功連線至伺服器，可以進入大廳！';
      statusEl.className = 'status-bar status-ok';
    }
  });

  socket.on('connect_error', (err) => {
    const statusEl = document.getElementById('connStatus');
    if (statusEl) {
      statusEl.innerText = '❌ 連線失敗：' + err.message;
      statusEl.className = 'status-bar status-wait';
    }
  });

  socket.on('disconnect', () => {
    const statusEl = document.getElementById('connStatus');
    if (statusEl) {
      statusEl.innerText = '⚠️ 與伺服器連線中斷，正在重新連線...';
      statusEl.className = 'status-bar status-wait';
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    const savedName = localStorage.getItem('vc_nickname');
    const savedNtfy = localStorage.getItem('vc_ntfy');
    if (savedName) document.getElementById('nicknameInput').value = savedName;
    if (savedNtfy) document.getElementById('ntfyInput').value = savedNtfy;
  });

  function enterLobby() {
    if (!socket.connected) {
      return alert('伺服器還在連線中，請等上方變成綠色提示後再按！');
    }
    const name = document.getElementById('nicknameInput').value;
    const ntfyTopic = document.getElementById('ntfyInput').value;
    if (!name.trim()) return alert('請先輸入你的稱呼！');
    socket.emit('quickLogin', { name, ntfyTopic });
  }

  socket.on('loginError', (msg) => alert(msg));

  socket.on('loginSuccess', (user) => {
    if (document.getElementById('rememberCheckbox').checked) {
      localStorage.setItem('vc_nickname', document.getElementById('nicknameInput').value);
      localStorage.setItem('vc_ntfy', document.getElementById('ntfyInput').value);
    } else {
      localStorage.removeItem('vc_nickname');
      localStorage.removeItem('vc_ntfy');
    }
    myUser = user;
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('mainBox').classList.remove('hidden');
    document.getElementById('myNameDisplay').innerText = user.name;
  });

  function changeMyNtfy() {
    const topic = prompt('請輸入手機 ntfy App 訂閱的頻道名稱（建議純英文加數字，留空可清除）：', myUser.ntfyTopic || '');
    if (topic !== null) {
      socket.emit('updateNtfy', topic);
      if (document.getElementById('rememberCheckbox').checked) localStorage.setItem('vc_ntfy', topic);
    }
  }

  socket.on('stateUpdate', (state) => {
    latestState = state;
    document.getElementById('totalUsersDisplay').innerText = `${state.totalUsers} / ${state.maxUsers}`;
    const me = state.onlineUsers.find(u => u.id === myUser.id);
    if (me) myUser = me;

    const roomsDiv = document.getElementById('roomsContainer');
    roomsDiv.innerHTML = '';
    const isFull = state.totalUsers >= state.maxUsers;

    for (let i = 1; i <= 5; i++) {
      const r = state.rooms[i];
      const isEmpty = r.members.length === 0;
      let btnHtml = '';
      if (myUser.currentRoom === r.id) btnHtml = `<button class="btn-success" disabled>你在此房間中</button>`;
      else if (myUser.currentRoom !== null) btnHtml = `<button disabled>請先離開目前房間</button>`;
      else if (isFull) btnHtml = `<button disabled>全站已滿 (20/20)</button>`;
      else if (isEmpty) btnHtml = `<button class="btn-primary" onclick="joinRoom(${r.id})">進入空房 (成為管理者)</button>`;
      else btnHtml = `<button class="btn-warning" onclick="joinRoom(${r.id})">申請進入 (需管理者同意)</button>`;

      roomsDiv.innerHTML += `
        <div class="room-card ${isEmpty ? '' : 'active'}">
          <h4>${r.name}</h4>
          <p>狀態：${isEmpty ? '空房間' : '使用中 (' + r.members.length + '人)'}</p>
          <p>管理者：<strong>${r.adminName || '無'}</strong></p>
          ${btnHtml}
        </div>`;
    }

    const roomPanel = document.getElementById('currentRoomPanel');
    if (myUser.currentRoom) {
      const curRoom = state.rooms[myUser.currentRoom];
      roomPanel.classList.remove('hidden');
      document.getElementById('myStatusDisplay').innerText = `目前位置：${curRoom.name} ${curRoom.adminId === myUser.id ? '(你是管理者)' : ''}`;
      document.getElementById('currentRoomTitle').innerText = `${curRoom.name} - 管理者：${curRoom.adminName}`;
      document.getElementById('roomMembersList').innerHTML = curRoom.members.map(m => `<span class="member-tag">${m.name}</span>`).join('');
    } else {
roomPanel.classList.add('hidden');
document.getElementById('myStatusDisplay').innerText = '目前位置：大廳';
}
const listDiv = document.getElementById('contactList');
listDiv.innerHTML = '';
state.contactList.forEach(u => {
if (u.name === myUser.name) return;
const pairKey = [myUser.name, u.name].sort().join('_');
const isPaired = state.confirmedPairs.includes(pairKey);
const statusBadge = u.isOnline ? <span class="badge-online">線上</span> : <span class="badge-offline">離線</span>;
const pairBadge = isPaired ? <span class="badge-paired">✓ 已配對</span> : '';
const callBtn = u.ntfyTopic ? <button class="btn-primary" style="margin-left:10px;" onclick="callUser('${u.name}')">📲 手機推播呼叫</button> : <span style="color:#999; font-size:13px; margin-left:10px;">(未設推播)</span>;
listDiv.innerHTML += <div style="margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #eee;"> <span>👤 <strong>${u.name}</strong> ${statusBadge} ${pairBadge}</span> ${callBtn} ${!isPaired && u.ntfyTopic ?🔑 設定4位數配對密碼 : ''} </div>;
});
});
function joinRoom(roomId) { socket.emit('requestJoinRoom', roomId); }
async function startLocalMedia() {
if (localStream) return localStream;
try {
localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
} catch (err) {
try {
localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
alert('偵測不到攝影機，將以純語音模式進入房間。');
} catch (e) {
localStream = new MediaStream();
alert('無法取得攝影機或麥克風權限，將以純觀看模式進入。');
}
}
addVideoBox('local', localStream, ${myUser.name} (我), true);
return localStream;
}
function stopLocalMedia() {
if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
Object.values(peerConnections).forEach(pc => pc.close());
peerConnections = {};
document.getElementById('videoGrid').innerHTML = '';
}
function addVideoBox(id, stream, labelText, isMuted = false) {
let existingWrap = document.getElementById(video-wrap-${id});
if (existingWrap) {
const existingVideo = existingWrap.querySelector('video');
if (existingVideo && existingVideo.srcObject !== stream) existingVideo.srcObject = stream;
return;
}
const grid = document.getElementById('videoGrid');
const wrapper = document.createElement('div');
wrapper.className = 'video-wrapper';
wrapper.id = video-wrap-${id};
const video = document.createElement('video');
video.srcObject = stream;
video.autoplay = true;
video.playsInline = true;
video.muted = isMuted;
const label = document.createElement('div');
label.className = 'video-label';
label.innerText = labelText;
wrapper.appendChild(video);
wrapper.appendChild(label);
grid.appendChild(wrapper);
video.play().catch(() => {});
}
function removeVideoBox(id) {
const el = document.getElementById(video-wrap-${id});
if (el) el.remove();
}
function createPeerConnection(targetId, targetName) {
if (peerConnections[targetId]) peerConnections[targetId].close();
const pc = new RTCPeerConnection(rtcConfig);
peerConnections[targetId] = pc;
if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
pc.onicecandidate = (event) => {
if (event.candidate) socket.emit('webrtcIceCandidate', { targetId, candidate: event.candidate });
};
pc.ontrack = (event) => {
if (event.streams && event.streams) addVideoBox(targetId, event.streams, targetName, false);
};
return pc;
}
socket.on('enteredRoom', async ({ roomId, existingMembers }) => {
await startLocalMedia();
for (const member of existingMembers) {
const pc = createPeerConnection(member.id, member.name);
const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
socket.emit('webrtcOffer', { targetId: member.id, offer });
}
});
socket.on('webrtcOffer', async ({ senderId, senderName, offer }) => {
await startLocalMedia();
const pc = createPeerConnection(senderId, senderName);
await pc.setRemoteDescription(new RTCSessionDescription(offer));
const answer = await pc.createAnswer();
await pc.setLocalDescription(answer);
socket.emit('webrtcAnswer', { targetId: senderId, answer });
});
socket.on('webrtcAnswer', async ({ senderId, answer }) => {
const pc = peerConnections[senderId];
if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
});
socket.on('webrtcIceCandidate', async ({ senderId, candidate }) => {
const pc = peerConnections[senderId];
if (pc && candidate) {
try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
}
});
socket.on('userLeftVideo', (leftSocketId) => {
if (peerConnections[leftSocketId]) { peerConnections[leftSocketId].close(); delete peerConnections[leftSocketId]; }
removeVideoBox(leftSocketId);
});
function toggleMic() {
if (!localStream) return;
const audioTrack = localStream.getAudioTracks();
if (audioTrack) {
audioTrack.enabled = !audioTrack.enabled;
document.getElementById('toggleMicBtn').innerText = audioTrack.enabled ? '🎤 麥克風：開啟' : '🔇 麥克風：靜音';
}
}
function toggleCam() {
if (!localStream) return;
const videoTrack = localStream.getVideoTracks();
if (videoTrack) {
videoTrack.enabled = !videoTrack.enabled;
document.getElementById('toggleCamBtn').innerText = videoTrack.enabled ? '📷 鏡頭：開啟' : '🚫 鏡頭：關閉';
}
}
socket.on('joinRequestToAdmin', ({ roomId, applicantId, applicantName }) => {
const approved = confirm(【進入申請】「${applicantName}」想要進入你的房間，是否同意？\n\n按「確定」同意進入，按「取消」拒絕。);
socket.emit('adminDecision', { roomId, applicantId, approved });
});
function initiateLeaveRoom() {
const curRoom = latestState.rooms[myUser.currentRoom];
if (curRoom.adminId === myUser.id && curRoom.members.length > 1) {
const wantAssign = confirm('你是目前房間的管理者，離開前是否要「指定下一位管理員」？\n\n按「確定」選擇指定對象\n按「取消」則由系統自動指派下一位成員');
if (wantAssign) {
const others = curRoom.members.filter(m => m.id !== myUser.id);
let listText = '請輸入要指定為新管理員的編號：\n';
others.forEach((m, idx) => { listText += ${idx + 1}. ${m.name}\n; });
const choice = prompt(listText);
const chosenMember = others[parseInt(choice) - 1];
if (chosenMember) { stopLocalMedia(); return socket.emit('leaveRoom', { nextAdminId: chosenMember.id }); }
else alert('輸入無效，將由系統自動指派下一位成員。');
}
}
stopLocalMedia();
socket.emit('leaveRoom', { nextAdminId: null });
}
function openPairDialog(targetName) {
const pin = prompt(請輸入與「${targetName}」約定好的【四位數數字密碼】以開啟呼叫權限（雙方輸入相同數字即可完成永久綁定）：);
if (pin && /^\d{4}$/.test(pin)) socket.emit('setupCallPair', { targetName, pin });
else if (pin !== null) alert('格式錯誤！請務必輸入 4 位數純數字（例如：1234）。');
}
function callUser(targetName) { socket.emit('triggerNtfyCall', { targetName }); }
socket.on('requirePairModal', (targetName) => { alert(你尚未與「${targetName}」完成四位數密碼配對，無法直接呼叫！請先進行密碼設定。); openPairDialog(targetName); });
socket.on('pairSuccess', (targetName) => alert(🎉 恭喜！你與「${targetName}」的四位數密碼驗證一致，已永久開通彼此的呼叫權限！));
socket.on('notification', (msg) => alert(msg));
